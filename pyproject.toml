[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plato-fno"
version = "0.1.0"
description = "FNO surrogate for exoplanet atmospheric retrieval — ESA PLATO mission"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
# PyTorch is deliberately not listed: install the build for your hardware first
# (CUDA, ROCm or CPU). Solaris is not on PyPI; install it from source first.
dependencies = [
    "solaris-rocm>=0.2.0",
    "emcee>=3.1.4",
    "corner>=2.2.2",
    "h5py>=3.8.0",
    "numpy>=2.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "tqdm>=4.65.0",
    "loguru>=0.7.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
prt = [
    "petitRADTRANS>=3.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pre-commit>=3.3.0",
    "ipykernel>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["plato_fno"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=plato_fno --cov-report=term-missing -v"
markers = ["slow: marks tests as slow (deselect with '-m not slow')"]
