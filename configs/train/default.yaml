batch_size: 64
epochs: 200
lr: 3e-4
weight_decay: 1e-4
# Higher beta1 (0.98 vs PyTorch default 0.9): ported from parameter-golf
# long-context experiments where higher momentum improved stability.
beta1: 0.98
beta2: 0.999
warmup_epochs: 10
min_lr: 1e-6
grad_clip: 1.0
early_stopping_patience: 20
train_frac: 0.80
val_frac: 0.10
# remaining 0.10 is calibration set
conformal_alpha: 0.1
# Mixed precision: "bf16" for ROCm/RDNA4, "fp16" for older hardware, "none" to disable
amp_dtype: none
# Overtone spectral init for FNO Fourier weights (power-law exponent).
# Set to 0.0 to disable. 0.5 matches the parameter-golf value.
spectral_init_exponent: 0.5
